<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jōb · page not found</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script>
      // GitHub Pages has no fallback for the demo's own pages (/demo/applications and so on):
      // hand the path to the demo, which puts it back in the address bar.
      if (location.pathname.startsWith('/demo/')) {
        location.replace('/demo/?p=' + encodeURIComponent(location.pathname + location.search + location.hash));
      }
    </script>
  </head>
  <body>
    <main>
      <section class="intro">
        <h1>Page not found</h1>
        <p>There is nothing at this address. <a href="/">Go to the home page</a></p>
      </section>
    </main>
  </body>
</html>
